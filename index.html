<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라이브클럽, 아직 춤추는 중</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Gugi&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#120a2b;--floor:#1d1147;--ink:#f3eaff;--dim:#9a88c9;--cy:#2de2ff;--mg:#ff3df0;--ye:#ffd23f;--li:#7dff6b;--rd:#ff4d5a;
--px:'Press Start 2P',ui-monospace,monospace;--ko:'Gugi','Malgun Gothic','Apple SD Gothic Neo',sans-serif;--body:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{display:flex;flex-direction:column;overflow:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
header{display:flex;align-items:center;gap:20px;padding:12px 18px;border-bottom:4px solid var(--mg);box-shadow:0 4px 0 var(--cy);background:#0c0620;flex-wrap:wrap}
h1{margin:0;font:400 clamp(20px,3.2vw,34px)/1.1 var(--ko);color:var(--cy);text-shadow:3px 3px 0 var(--mg)}
header p{margin:0;font-size:13px;line-height:1.5;color:var(--dim);max-width:46ch;flex:1 1 260px}
.stats{display:flex;gap:14px;font:400 10px/1 var(--px);color:var(--ye)}
.stats b{display:block;font-size:18px;color:var(--li);margin-bottom:6px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 380px}
#stage{position:relative;min-height:0;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;image-rendering:pixelated}
canvas.drag{cursor:grabbing}
.ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.ctl button,.chips button,.list button,.go{font:400 12px/1 var(--px);color:var(--ink);background:#0c0620;border:3px solid var(--cy);padding:9px 10px;cursor:pointer;box-shadow:3px 3px 0 var(--mg)}
.ctl button{width:40px;height:40px;font-size:14px}
.ctl button:active,.go:active{transform:translate(3px,3px);box-shadow:none}
.hint{position:absolute;left:12px;bottom:10px;font:400 9px/1.6 var(--px);color:var(--dim);background:#0c0620cc;padding:6px 8px;pointer-events:none}
.legend{position:absolute;left:12px;top:12px;font-size:12px;background:#0c0620dd;border:3px solid var(--rd);padding:8px 10px;max-width:230px;line-height:1.45}
.legend i{display:inline-block;width:10px;height:10px;background:var(--rd);margin-right:6px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
aside{display:flex;flex-direction:column;min-height:0;border-left:4px solid var(--cy);background:#0c0620}
#detail{padding:14px;border-bottom:4px solid var(--mg);max-height:68%;overflow:auto}
#detail.empty{font-size:13px;color:var(--dim);line-height:1.6}
.name{margin:0 0 4px;font:400 20px/1.3 var(--ko);color:var(--ye)}
.addr{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--dim)}
.ig{display:flex;gap:12px;align-items:center;padding:10px;border:3px solid var(--mg);margin-bottom:10px;background:var(--floor)}
.ig svg{width:56px;height:56px;flex:none;image-rendering:pixelated;border:3px solid var(--cy)}
.ig .h{font:400 11px/1.5 var(--px);word-break:break-all}
.ig .k{font-size:12px;color:var(--dim);margin-top:4px}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.posts a{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.35;text-decoration:none;border:3px solid var(--cy);background:conic-gradient(#2a1566 25%,#1d1147 0 50%,#2a1566 0 75%,#1d1147 0) 0 0/16px 16px}
.posts a:hover{border-color:var(--ye)}
.go{display:inline-block;text-decoration:none;margin-right:8px;margin-bottom:6px;font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.chips button{font-size:9px;padding:7px 8px;border-width:2px;box-shadow:none}
.chips button[aria-pressed=true]{background:var(--mg);border-color:var(--mg);color:#fff}
#q{margin:10px 12px;padding:10px;font:inherit;font-size:14px;color:var(--ink);background:var(--floor);border:3px solid var(--cy)}
.list{flex:1;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.list button{font:400 13px/1.4 var(--body);text-align:left;box-shadow:none;border-width:2px;border-color:#3a2a78}
.list button small{display:block;color:var(--dim);font-size:11px}
.list button[aria-current=true]{border-color:var(--ye);background:var(--floor)}
.none{color:var(--dim);font-size:13px;padding:8px 0}
@media (max-width:820px){
 body{overflow:auto}
 main{grid-template-columns:1fr;grid-template-rows:62vh auto}
 aside{border-left:0;border-top:4px solid var(--cy)}
 #detail{max-height:none}.list{max-height:50vh}
 .legend{display:none}
}
@media (prefers-reduced-motion:reduce){.legend i{animation:none}}

#map{position:absolute;inset:0;background:#120a2b}
.leaflet-control-attribution{background:#0c0620cc!important;color:var(--dim)!important}.leaflet-control-attribution a{color:var(--cy)!important}
.leaflet-bar a{background:#0c0620;color:var(--cy);border-color:var(--cy)}
.dn{background:none;border:0}
.dw{position:relative;width:30px;height:34px}
.dw span{position:absolute;inset:0}.dw svg{display:block}
.fa{animation:fa .84s steps(1) infinite}.fb{animation:fb .84s steps(1) infinite}
.odd .dw span{animation-delay:-.42s}
@keyframes fa{0%{visibility:visible}50%{visibility:hidden}}
@keyframes fb{0%{visibility:hidden}50%{visibility:visible}}
.hot .dw{animation:hb .5s steps(1) infinite}@keyframes hb{50%{opacity:.35}}
.tip{font:400 13px var(--body);background:#0c0620;color:#fff;border:2px solid var(--cy);border-radius:0}
.tip:before{display:none}
.tip.sel{background:var(--ye);color:#120a2b;border-color:#fff;font-weight:700}
.igf{width:100%;height:440px;border:3px solid var(--mg);background:#fff;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.fa,.fb,.hot .dw{animation:none}.fb{visibility:hidden}}
</style>
</head>

D.forEach(v=>{v.m=L.marker([v.la,v.ln],{title:v.n,keyboard:true,icon:mkIcon(v,false)});tip(v,false);v.m.on('click',()=>choose(v))});
function refresh(){layer.clearLayers();D.filter(vis).forEach(v=>layer.addLayer(v.m))}
function showDetail(v){const d=$('#detail');d.className='';const u='https://www.instagram.com/'+encodeURIComponent(v.h)+'/';
 d.innerHTML=`<h2 class="name">${esc(v.n)}</h2><p class="addr">${esc(v.a)}</p>`+(v.o?'<p class="addr" style="color:var(--rd)">영업정지 사태로 이 프로젝트가 시작된 곳이에요.</p>':'')+
 (v.h?`<iframe class="igf" src="${u}embed" loading="lazy" title="${esc(v.n)} 인스타그램 프로필과 최근 게시물" allowtransparency="true" scrolling="yes"></iframe><p class="addr">프로필과 게시물이 보이지 않으면 아래 버튼으로 인스타그램에서 직접 열어 주세요.</p>`:'<p class="addr">등록된 인스타그램 계정이 없어요.</p>')+
 (v.h?`<a class="go" href="${u}" target="_blank" rel="noopener">인스타그램 열기</a>`:'')+`<a class="go" href="https://map.naver.com/p/search/${encodeURIComponent(v.a)}" target="_blank" rel="noopener">길 찾기</a>`}
function choose(v){if(sel&&sel!==v)mark(sel,false);sel=v;mark(v,true);showDetail(v);map.flyTo([v.la,v.ln],Math.max(map.getZoom(),15),{duration:.8});renderList();const el=document.querySelector('.list [aria-current=true]');if(el)el.scrollIntoView({block:'nearest'});$('#detail').scrollTop=0}
function renderList(){const a=D.filter(vis);$('#list').innerHTML=a.length?a.map(v=>`<button data-i="${v.i}" ${v===sel?'aria-current="true"':''}>${esc(v.n)}<small>${esc(v.r+' '+(v.d||''))}</small></button>`).join(''):'<div class="none">조건에 맞는 클럽이 없어요. 검색어나 지역을 바꿔 보세요.</div>'}
$('#list').onclick=e=>{const b=e.target.closest('button');if(b)choose(D[+b.dataset.i])};
$('#chips').innerHTML=['전체',...RC,'기타'].map(g=>`<button aria-pressed="${g==='전체'}" data-g="${g}">${g}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;filt=b.dataset.g;document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderList();refresh();const a=D.filter(vis);
 if(filt!=='전체'&&a.length)map.flyToBounds(L.latLngBounds(a.map(v=>[v.la,v.ln])),{padding:[50,50],maxZoom:15});else map.flyTo([36.2,127.8],7)};
$('#q').oninput=e=>{qs=e.target.value.trim().toLowerCase();renderList();refresh()};
$('#sN').textContent=D.length;$('#sR').textContent=new Set(D.map(v=>v.g)).size;
renderList();refresh();addEventListener('load',()=>map.invalidateSize());
</script>
</body>
</html>
